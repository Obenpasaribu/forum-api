# NGINX reverse proxy untuk Forum API.
# Salin ke /etc/nginx/sites-available/forumapi lalu ganti YOUR_DOMAIN_HERE.
# HTTPS ditambahkan otomatis oleh: sudo certbot --nginx -d YOUR_DOMAIN_HERE
# (certbot akan menambah blok listen 443 + redirect 80 -> 443 dan mempertahankan blok location di bawah).

# Limit akses: 90 request/menit per IP untuk /threads dan seluruh turunannya.
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    # /threads, /threads/:id, /threads/:id/comments, .../replies, .../likes
    location /threads {
        limit_req zone=threads_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
